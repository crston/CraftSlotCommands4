# Craft Slot Commands 5 - Multi-Page RPG Navigation Configuration
# Craft Slot Commands 5 - 멀티 페이지 RPG 내비게이션 설정

# crafting-slot or keybind-commands
# 제작 슬롯 클릭 방식 또는 키바인딩 방식 선택
cmd-type: crafting-slot

# Set whether to place custom items in the crafting slots
# 제작 슬롯 공간에 커스텀 메뉴 아이템을 배치할지 여부 설정
items-enabled: true

# When true, armor slots (use-slot 5-8) become packet-only menus.
# Server armor for those slots is cleared and vanilla equip is blocked.
# 5=helmet, 6=chestplate, 7=leggings, 8=boots
# true 이면 방어구 슬롯(use-slot 5-8)을 패킷 전용 메뉴로 사용합니다.
armor-slots-as-menu: false

# Multi-Page Layout Layers Configuration
# 멀티 페이지 레이아웃 레이어 설정
menu-pages:

  # ----------------------------------------------------
  # [MAIN LAYER] - Default view when opening inventory
  # [메인 레이어] - 인벤토리를 열었을 때 최초로 보이는 기본 화면
  # ----------------------------------------------------
  MAIN:
    use-slot:
      0: true
      1: true
      2: true
      3: true
      4: true
      # Requires armor-slots-as-menu: true
      # armor-slots-as-menu: true 필요
      5: true
      6: true
      7: true
      8: true
    slot-item:
      0:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Crafting ]"
        model: 180
      1:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Stats ]"
        model: 176
      2:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Teleport ]"
        model: 177
      3:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Storage ]"
        model: 178
      4:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Settings ]"
        model: 179
      5:
        material: GRAY_STAINED_GLASS_PANE
        name: "&f&l[ Helmet Menu ]"
        model: 195
        strip-attributes: true
        hide-all-flags: true
      6:
        material: GRAY_STAINED_GLASS_PANE
        name: "&f&l[ Chest Menu ]"
        model: 196
        strip-attributes: true
        hide-all-flags: true
      7:
        material: GRAY_STAINED_GLASS_PANE
        name: "&f&l[ Legs Menu ]"
        model: 197
        strip-attributes: true
        hide-all-flags: true
      8:
        material: GRAY_STAINED_GLASS_PANE
        name: "&f&l[ Boots Menu ]"
        model: 198
        strip-attributes: true
        hide-all-flags: true
    crafting-slot:
      0: "gui open craftmenu"
      1: "*csc_state STAT_PAGE"
      2: "*csc_state MOVE_PAGE"
      3: "bank open"
      4: "*csc_state SETTING_PAGE"
      5: "say Helmet slot menu"
      6: "say Chest slot menu"
      7: "say Legs slot menu"
      8: "say Boots slot menu"
    keybind-commands:
      0:
        1: "/say Pressed 1 on slot 0"
        2: "/say Pressed 2 on slot 0"
        3: "/say Pressed 3 on slot 0"
        4: "/say Pressed 4 on slot 0"
        5: "/say Pressed 5 on slot 0"
        6: "/say Pressed 6 on slot 0"
        7: "/say Pressed 7 on slot 0"
        8: "/say Pressed 8 on slot 0"
        9: "/say Pressed 9 on slot 0"
        Q: "/say You pressed Q on slot 0"
        F: "/say Swapped hand in slot 0"
        LEFT: "/say Left click slot 0"
        RIGHT: "/say Right click slot 0"
        DROP: "/say Dropped item from slot 0"
      1:
        1: "/say Pressed 1 on slot 1"
        2: "/say Pressed 2 on slot 1"
        3: "/say Pressed 3 on slot 1"
        4: "/say Pressed 4 on slot 1"
        5: "/say Pressed 5 on slot 1"
        6: "/say Pressed 6 on slot 1"
        7: "/say Pressed 7 on slot 1"
        8: "/say Pressed 8 on slot 1"
        9: "/say Pressed 9 on slot 1"
        Q: "/say You pressed Q on slot 1"
        F: "/say Swapped hand in slot 1"
        LEFT: "/say Left click slot 1"
        RIGHT: "/say Right click slot 1"
        DROP: "/say Dropped item from slot 1"
      2:
        1: "/say Pressed 1 on slot 2"
        2: "/say Pressed 2 on slot 2"
        3: "/say Pressed 3 on slot 2"
        4: "/say Pressed 4 on slot 2"
        5: "/say Pressed 5 on slot 2"
