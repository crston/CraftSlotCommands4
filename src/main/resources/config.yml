# Craft Slot Commands 5 - Multi-Page RPG Navigation Configuration
# 제작 슬롯(0–4) 메뉴만 지원합니다. 방어구 슬롯 메뉴는 제거되었습니다.

# crafting-slot or keybind-commands
cmd-type: crafting-slot

# 제작 슬롯에 커스텀 메뉴 아이템을 배치할지 여부
items-enabled: true

menu-pages:

  MAIN:
    use-slot:
      0: true
      1: true
      2: true
      3: true
      4: true
    slot-item:
      0:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Crafting ]"
        model: 180
      1:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Stats ]"
        model: 176
      2:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Teleport ]"
        model: 177
      3:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Storage ]"
        model: 178
      4:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Settings ]"
        model: 179
    crafting-slot:
      0: "gui open craftmenu"
      1: "*csc_state STAT_PAGE"
      2: "*csc_state MOVE_PAGE"
      3: "bank open"
      4: "*csc_state SETTING_PAGE"
    keybind-commands:
      0:
        1: "/say Pressed 1 on slot 0"
        2: "/say Pressed 2 on slot 0"
        3: "/say Pressed 3 on slot 0"
        4: "/say Pressed 4 on slot 0"
        5: "/say Pressed 5 on slot 0"
        6: "/say Pressed 6 on slot 0"
        7: "/say Pressed 7 on slot 0"
        8: "/say Pressed 8 on slot 0"
        9: "/say Pressed 9 on slot 0"
        Q: "/say You pressed Q on slot 0"
        F: "/say Swapped hand in slot 0"
        LEFT: "/say Left click slot 0"
        RIGHT: "/say Right click slot 0"
        DROP: "/say Dropped item from slot 0"
      1:
        LEFT: "/say Left click slot 1"
        RIGHT: "/say Right click slot 1"
      2:
        LEFT: "/say Left click slot 2"
        RIGHT: "/say Right click slot 2"
      3:
        LEFT: "/say Left click slot 3"
        RIGHT: "/say Right click slot 3"
      4:
        LEFT: "/say Left click slot 4"
        RIGHT: "/say Right click slot 4"

  STAT_PAGE:
    use-slot:
      0: true
      1: true
      2: true
      3: true
      4: true
    slot-item:
      0:
        material: GREEN_STAINED_GLASS_PANE
        name: "&c&l[ Back ]"
        model: 180
      1:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Status ]"
        model: 176
      2:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Equipment ]"
        model: 181
      3:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Mastery ]"
        model: 182
      4:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Skills ]"
        model: 183
    crafting-slot:
      0: "*csc_state MAIN"
      1: "status open"
      2: "equipment open"
      3: "mastery open"
      4: "skills open"

  MOVE_PAGE:
    use-slot:
      0: true
      1: true
      2: true
      3: true
      4: true
    slot-item:
      0:
        material: GREEN_STAINED_GLASS_PANE
        name: "&c&l[ Back ]"
        model: 180
      1:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Spawn ]"
        model: 185
      2:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Shop ]"
        model: 186
      3:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Wild ]"
        model: 187
      4:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Dungeon ]"
        model: 188
    crafting-slot:
      0: "*csc_state MAIN"
      1: "spawn"
      2: "shop"
      3: "wild"
      4: "warp field"

  SETTING_PAGE:
    use-slot:
      0: true
      1: true
      2: true
      3: true
      4: true
    slot-item:
      0:
        material: GREEN_STAINED_GLASS_PANE
        name: "&c&l[ Back ]"
        model: 180
      1:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Quest ]"
        model: 191
      2:
        material: GREEN_STAINED_GLASS_PANE
        name: "&f&l[ Details ]"
